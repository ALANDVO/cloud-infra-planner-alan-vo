# compose.yaml — development stack for cloud-infra-planner-alan-vo
# Binds all dev ports to 127.0.0.1. No production deployment from this host.
name: cloud-infra-planner
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cloud-infra-planner-backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      keycloak:
        condition: service_started

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: cloud-infra-planner-keycloak
    command: start-dev --import-realm
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: dev-file
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/realm-export:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/realms/master"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

volumes:
  keycloak-data: